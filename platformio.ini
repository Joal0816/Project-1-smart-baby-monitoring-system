; RT-Spark STM32F407ZGT6. SWD target: DEV_ID 0x413, 1024 KiB flash.
; Clock remains HSI 16 MHz until the board's 8 MHz HSE path is validated.

[platformio]
default_envs = rtspark_f407zg_hsi
src_dir = firmware/src
include_dir = firmware/include
lib_dir = firmware/lib
test_dir = firmware/test
boards_dir = firmware/boards

[env:rtspark_f407zg_hsi]
platform = ststm32@20.0.0
board = rtspark_f407zg_hsi
framework = stm32cube
platform_packages =
    platformio/framework-stm32cubef4@1.28.3
    platformio/toolchain-gccarmnoneeabi@1.120301.0
    platformio/tool-openocd@~3.1200.7
extra_scripts =
    pre:tools/freertos_build.py
    pre:tools/lwip_build.py
    pre:tools/mbedtls_build.py
    pre:tools/patch_altcp_tls.py
build_flags =
    -mfpu=fpv4-sp-d16
    -mfloat-abi=hard
    -Wextra
    -I firmware/include
    -D USE_HAL_DRIVER
    -D STM32F407xx
    -D HSE_VALUE=8000000U
    -D MBEDTLS_CONFIG_FILE=\"mbedtls_config.h\"
monitor_speed = 115200
